services:
  mongodb:
    build:
      dockerfile: ./mongodb/Dockerfile
    container_name: todo-test-mongodb
    networks:
      - test-network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=the_username
      - MONGO_INITDB_ROOT_PASSWORD=the_password
      - MONGO_INITDB_DATABASE=the_database
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis
    container_name: todo-test-redis
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: ./todo-backend
      dockerfile: Dockerfile
    image: todo-backend
    container_name: todo-backend
    environment:
      MONGO_URL: mongodb://the_username:the_password@mongodb:27017/the_database
      REDIS_URL: redis://redis:6379
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: ./todo-frontend
      dockerfile: Dockerfile
    image: todo-front
    container_name: todo-front
    environment:
      - VITE_BACKEND_URL=http://localhost:8080
    networks:
      - test-network
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  e2e-test:
    depends_on:
      nginx:
        condition: service_healthy
      backend:
        condition: service_healthy
    build:
      context: ./todo-tests
      dockerfile: Dockerfile
    image: todo-e2e
    container_name: todo-e2e
    networks:
      - test-network
    environment:
      BASE_URL: http://nginx:80
    volumes:
      # Persists tests results and reports
      - ./todo-tests/test-results:/todo-tests/test-results
      - ./todo-tests/playwright-report:/todo-tests/playwright-report

networks:
  test-network:
    driver: bridge
