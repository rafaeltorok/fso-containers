services:
  mongodb:
    build:
      dockerfile: ./mongodb/Dockerfile
    container_name: todo-app-mongodb
    ports:
      - 3456:27017
    networks:
      - todo-app-network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=the_username
      - MONGO_INITDB_ROOT_PASSWORD=the_password
      - MONGO_INITDB_DATABASE=the_database
    volumes:
      - ./mongo_data:/data/db   # Persists the MongoDB data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis
    container_name: todo-app-redis
    ports:
      - 6379:6379
    networks:
      - todo-app-network
    volumes:
      - ./redis_data:/data  # Persists Redis data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  server:
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: ./todo-backend
      dockerfile: Dockerfile
    container_name: todo-app-server
    ports:
      - 3000:3000
    environment:
      MONGO_URL: mongodb://the_username:the_password@mongodb:27017/the_database
      REDIS_URL: redis://redis:6379
    networks:
      - todo-app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  client:
    depends_on:
      server:
        condition: service_healthy
    build:
      context: ./todo-frontend
      dockerfile: Dockerfile
    container_name: todo-app-client
    ports:
      - 8000:80
    environment:
      - VITE_BACKEND_URL=http://server:3000
    networks:
      - todo-app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  todo-app-network:
    driver: bridge
