services:
  dev-mongodb:
    image: mongo
    container_name: todo-dev-mongodb
    ports:
      - 3456:27017
    networks:
      - dev-network
    environment:
      - MONGO_INITDB_ROOT_USERNAME=the_username
      - MONGO_INITDB_ROOT_PASSWORD=the_password
      - MONGO_INITDB_DATABASE=the_database
    volumes:
      - ./todo-backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dev-redis:
    image: redis
    container_name: todo-dev-redis
    ports:
      - 6379:6379
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dev-server:
    depends_on:
      dev-mongodb:
        condition: service_healthy
      dev-redis:
        condition: service_healthy
    build:
      context: ./todo-backend
      dockerfile: Dockerfile.dev
    container_name: todo-dev-server
    environment:
      MONGO_URL: mongodb://the_username:the_password@todo-dev-mongodb:27017/the_database
      REDIS_URL: redis://todo-dev-redis:6379
    volumes:
      - ./todo-backend:/usr/src/app/todo-backend
      - /usr/src/app/node_modules
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dev-client:
    depends_on:
      dev-server:
        condition: service_healthy
    build:
      context: ./todo-frontend
      dockerfile: Dockerfile.dev
    container_name: todo-dev-client
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    volumes:
      - ./todo-frontend:/usr/src/app/todo-frontend
      - /usr/src/app/node_modules
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  
  dev-nginx:
    depends_on:
      dev-client:
        condition: service_healthy
      dev-server:
        condition: service_healthy
    image: nginx:stable-alpine
    container_name: todo-dev-nginx-proxy
    ports:
      - 8000:80
    networks:
      - dev-network
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  debug-helper:
    image: busybox
    container_name: todo-debug-helper
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
